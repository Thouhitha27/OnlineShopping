<!DOCTYPE html>

<html>

<head>
    <title>Online Shopping - Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

```
<header>

    <h1>🛍️ Online Shopping</h1>

    <nav>
        <a href="home.html">Home</a>
        <a href="#products">Products</a>
        <a href="#cart">Cart 🛒</a>
        <a href="index.html">Login</a>
    </nav>

</header>

<main>

    <h2>Welcome to Online Shopping!</h2>

    <p>Find your favourite products at the best prices.</p>

    <button onclick="shopNow()">Shop Now</button>

    <h2 id="products">Featured Products</h2>

    <div class="products">

        <!-- Laptop -->
        <div class="product">

            <h3>💻 Laptop</h3>

            <p>₹50,000</p>

            <button onclick="addToCart('Laptop', 50000)">
                Add to Cart
            </button>

        </div>

        <!-- Mobile -->
        <div class="product">

            <h3>📱 Mobile</h3>

            <p>₹20,000</p>

            <button onclick="addToCart('Mobile', 20000)">
                Add to Cart
            </button>

        </div>

        <!-- Headphones -->
        <div class="product">

            <h3>🎧 Headphones</h3>

            <p>₹2,000</p>

            <button onclick="addToCart('Headphones', 2000)">
                Add to Cart
            </button>

        </div>

    </div>


    <!-- CART SECTION -->

    <section id="cart">

        <h2>🛒 Shopping Cart</h2>

        <button onclick="viewCart()">
            View Cart
        </button>

        <button onclick="reviewCart()">
            Review Cart
        </button>

        <button onclick="removeSelectedProduct()">
            Remove Product
        </button>

    </section>


    <!-- EXIT -->

    <section>

        <h2>Exit</h2>

        <button onclick="exitApp()">
            Exit
        </button>

    </section>

</main>


<!-- JavaScript -->
<script src="script.js"></script>
```

</body>

</html>
